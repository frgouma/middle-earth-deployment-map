<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Middle-earth Deployment Map — Prototype 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="map-app">
    <div class="controls" aria-label="Map controls">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="reset-view" type="button">Reset</button>
      <button id="travel" type="button">Travel to X2</button>
      <output id="coordinates" class="coordinate-readout">x: —, y: —</output>
    </div>

    <svg
      id="map"
      viewBox="850 1550 1500 1125"
      role="img"
      aria-label="Interactive Middle-earth deployment map prototype"
    >
      <defs>
        <mask id="route-reveal-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="4266.6665" height="3200">
          <rect x="0" y="0" width="4266.6665" height="3200" fill="black" />
          <path id="route-reveal-path" class="route-reveal-path" />
        </mask>
      </defs>

      <image
        href="map.svg"
        x="0"
        y="0"
        width="4266.6665"
        height="3200"
        preserveAspectRatio="xMidYMid meet"
      />

      <g id="overlay" aria-label="Deployment journey overlay">
        <path
          id="journey-path"
          class="journey-path"
          mask="url(#route-reveal-mask)"
        />

        <g id="marker-x1" class="test-marker" transform="translate(1250 2050)">
          <line x1="-40" y1="-40" x2="40" y2="40" />
          <line x1="-40" y1="40" x2="40" y2="-40" />
          <text x="58" y="-48">X1</text>
        </g>

        <g id="marker-x2" class="test-marker marker-x2" transform="translate(2925 1400)">
          <line class="x2-stroke" x1="-40" y1="-40" x2="40" y2="40" />
          <line class="x2-stroke" x1="-40" y1="40" x2="40" y2="-40" />
          <text class="x2-label" x="58" y="-48">X2</text>
        </g>
      </g>
    </svg>
  </main>

  <script src="app.js"></script>
</body>
</html>
