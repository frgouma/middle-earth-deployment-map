<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Middle-earth Deployment Map</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="map-app">
    <div class="controls">
      <div class="public-controls" aria-label="Journey controls">
        <label class="chapter-selector">
          <span>Chapter</span>
          <select id="chapter-select">
            <option value="intro">Introduction</option>
            <option value="1">I — The Council of CIT</option>
            <option value="2">II — Concerning Docker</option>
            <option value="3">III — An Unexpected Container</option>
            <option value="4">IV — The Grey Havens of Harbor</option>
            <option value="5">V — Riddles in the Cluster</option>
            <option value="6">VI — The Balrog of Database Connectivity</option>
            <option value="7">VII — The Entmoot of Migration Warnings</option>
            <option value="8">VIII — The Mines of Persistence</option>
            <option value="9">IX — A Long-expected Detour</option>
            <option value="10">X — The Two Containers</option>
            <option value="11">XI — A Short Cut to Kubernetes</option>
            <option value="12">XII — The Return of the Pod</option>
            <option value="13">XIII — The Last Stage</option>
            <option value="14">Epilogue — The Council's Map</option>
            <option value="all">Complete journey</option>
          </select>
        </label>

        <div class="play-controls">
          <button id="play-story" class="story-button" type="button"
                  aria-label="Play full story" title="Play full story">Play story</button>
          <button id="play-pause" class="icon-button" type="button"
                  aria-label="Play" title="Play">▶</button>
          <button id="stop-playback" class="icon-button" type="button"
                  aria-label="Stop and finish" title="Stop and finish">■</button>
        </div>
      </div>

      <div class="waypoint-tools" aria-label="Waypoint logger">
        <textarea
          id="waypoint-log"
          class="waypoint-log"
          rows="3"
          readonly
          aria-label="Recorded waypoint coordinates"
          placeholder="Click map to add waypoints"
        ></textarea>
        <div class="waypoint-actions">
          <button id="undo-waypoint" type="button" title="Undo last waypoint">Undo</button>
          <button id="clear-waypoints" type="button" title="Clear waypoints">Clear</button>
          <button id="copy-waypoints" type="button" title="Copy waypoints">Copy</button>
        </div>
      </div>
    </div>

    <div class="scene-stack">
      <svg
        id="map"
        class="scene scene-middle-earth"
        viewBox="0 0 4266.6665 3200"
        role="img"
        aria-label="Interactive Middle-earth deployment journey"
      >
        <defs id="route-defs"></defs>

      

      

      

      <image
        href="map.svg"
        x="0"
        y="0"
        width="4266.6665"
        height="3200"
        preserveAspectRatio="xMidYMid meet"
      />

<image
        class="map-tint map-tint-water"
        href="water-tint.png"
        x="0" y="0"
        width="4266.6665" height="3200"
        preserveAspectRatio="xMidYMid meet"
        pointer-events="none"
      />

      <image
        class="map-tint map-tint-forest"
        href="forest-tint.png"
        x="0" y="0"
        width="4266.6665" height="3200"
        preserveAspectRatio="xMidYMid meet"
        pointer-events="none"
      />

      <image
        class="map-tint map-tint-mordor"
        href="mordor-tint.png"
        x="0" y="0"
        width="4266.6665" height="3200"
        preserveAspectRatio="xMidYMid meet"
        pointer-events="none"
      />

      <image
        class="map-tint map-tint-river"
        href="river-tint.png"
        x="0" y="0"
        width="4266.6665" height="3200"
        preserveAspectRatio="xMidYMid meet"
        pointer-events="none"
      />

        <g id="routes-layer" aria-label="Journey routes"></g>
        <g id="markers-layer" aria-label="Chapter markers"></g>
      </svg>

      <object
        id="council-map"
        class="scene scene-council"
        data="diagram/diagram.svg"
        type="image/svg+xml"
        role="img"
        aria-label="The Council's Map deployment architecture"
        aria-hidden="true"
      >
        The Council's Map could not be loaded.
      </object>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
