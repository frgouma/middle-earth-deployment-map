<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Middle-earth Deployment Map</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="map-app">
    <div class="controls" aria-label="Journey controls">
      <label class="chapter-selector">
        <span>Chapter</span>
        <select id="chapter-select">
          <option value="intro">Introduction</option>
          <option value="1">I — The Council of CIT</option>
          <option value="2">II — Concerning Docker</option>
          <option value="3">III — An Unexpected Container</option>
          <option value="4">IV — The Grey Havens of Harbor</option>
          <option value="all">Complete journey</option>
        </select>
      </label>

      <button id="play-story" class="story-button" type="button"
              aria-label="Play full story" title="Play full story">Play story</button>
      <button id="play-pause" class="icon-button" type="button"
              aria-label="Play" title="Play">▶</button>
      <button id="previous-chapter" class="icon-button" type="button"
              aria-label="Previous chapter" title="Previous chapter">⏮</button>
      <button id="next-chapter" class="icon-button" type="button"
              aria-label="Next chapter" title="Next chapter">⏭</button>

      <output id="coordinates" class="coordinate-readout">x: —, y: —</output>
    </div>

    <svg
      id="map"
      viewBox="0 0 4266.6665 3200"
      role="img"
      aria-label="Interactive Middle-earth deployment journey"
    >
      <defs id="route-defs"></defs>

      <image
        href="map.svg"
        x="0"
        y="0"
        width="4266.6665"
        height="3200"
        preserveAspectRatio="xMidYMid meet"
      />

      <g id="routes-layer" aria-label="Journey routes"></g>
      <g id="markers-layer" aria-label="Chapter markers"></g>
    </svg>
  </main>

  <script src="app.js"></script>
</body>
</html>
